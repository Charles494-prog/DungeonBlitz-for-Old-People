     command line (one whose name contains ".swf"), never a web address, so this file just
     forwards to the server's home page. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dungeon Blitz</title>
<meta http-equiv="refresh" content="0; url=http://localhost:8000/home">
<script>location.replace("http://localhost:8000/home");</script>
<style>
  body { margin: 0; background: #17110b; color: #e8c45a; font: 20px "Segoe UI", sans-serif;
         display: flex; align-items: center; justify-content: center; height: 100vh; }
  a { color: #f5e6c8; }
</style>
</head>
<body>
<p>Loading Dungeon Blitz&hellip; <a href="http://localhost:8000/home">Open the home page</a></p>
</body>
</html>
